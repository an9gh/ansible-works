---
- name: Deplay and initialize Apache web server on target myhost group
  hosts: myhosts
  become: true

  tasks: 
    - name: Install httpd package
      ansible.builtin.dnf:
        name: httpd
        state: latest
    - name: Start and enable httpd service
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
- name: Install and initialize Firewall service on manage node2
  hosts: node2
  become: true

  tasks: 
    - name: Install firewalld package
      ansible.builtin.dnf:
        name: firewalld
        state: latest
    - name: Start and enable firewalld service
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

